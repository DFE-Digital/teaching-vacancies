en:
  helpers:
    hint:
      publishers_job_listing_about_the_role_form:
        about_organisation: >-
          This will appear next to the job details under '%{organisation_type} overview'. Feel free to adapt this text
        about_schools: >-
          Give a brief summary of the schools where the jobseeker would be teaching and any relevant information about
          the %{organisation_type}
        ect_suitable: Early career teachers were previously called newly qualified teachers (NQTs)
        job_advert: >-
          Get jobseekers interested in the role by providing a brief summary of around 400 words.
          You should cover what the role is and who you're looking to recruit.
          The first 20 to 40 words will be shown in search results, so make them stand out.
        flexi_working_details_provided: Providing details about flexible working may increase the number of applications you receive for this role
        school_offer: Provide details about what your organisation can offer staff, for example, employee benefits, wellbeing support or professional development.

