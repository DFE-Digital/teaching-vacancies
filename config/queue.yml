default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  # Each worker definition below runs on every Kubernetes worker pod in production.
  # Total concurrency is roughly (sum of (processes * threads) per worker) x (number of pods).
  # For example, worker1 (processes=1, threads=3) + worker2 (processes=1, threads=1) across 4 pods = (3 + 1) x 4 = 16 threads.
  workers:
    # First worker: handles most queues, with parallel threads and frequent polling.
    # Queues are drained in priority order, left to right: notify jobs first, then default, then low.
    - queues: [ notify, default, low ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.5
    # Second worker: handles throttled jobs, with a single thread and process
    # and less frequent polling. Queues are drained in priority order, left to right.
    # We throttle via worker concurrency and polling interval rather than #limit_concurrency
    # in the jobs themselves, because per-job concurrency limits are costly:
    # https://github.com/rails/solid_queue#performance-considerations
    # Only reach for #limit_concurrency when strictly necessary.
    - queues: [ dbintensive, solid_queue_recurring, jobalerts ]
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
