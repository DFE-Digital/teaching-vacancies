version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # TODO: Remove this ignore config once moved to a Redis v6.2+ instance in AKS.
      # The gem is pinned to ~> 4.8.1 as our Redis service instance is 6.0 on Azure.
      # Once the instance is 6.2+, both this ignore and the Gemfile pin can be removed.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

      # TODO: Remove this ignore config when we can upgrade to view components 4.x
      # which is brought in by govuk-components 5.11.2
      - dependency-name: "view_component"
        update-types: ["version-update:semver-major"]

      # This needs to be done by hand as dependabot doesn't spot our Dockerfiles with the bundler
      # version coded in them
      - dependency-name: "bundler"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

      # We don't want Dependabot to update Rails major or minor versions automatically.
      # We will update Rails manually, besides patch updates which are handled by the 'rails' group below.
      - dependency-name: "actionmailer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "actionpack"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "actiontext"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "activejob"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "activemodel"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "activerecord"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "activestorage"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "activesupport"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rails"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "railties"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

    # Major gem updates are opened in separate PRs.
    # Minor and patch updates are grouped together as per the groups defined below.
    groups:
      # By default, all gem minor & patch updates (excluding govuk* and rails gems) are grouped into a single PR.
      general-gems:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "govuk-components"
          - "govuk_design_system_formbuilder"
          - "actionmailer"
          - "actionpack"
          - "actiontext"
          - "activejob"
          - "activemodel"
          - "activerecord"
          - "activestorage"
          - "activesupport"
          - "rails"
          - "railties"
      # Rails patch updates are grouped together into a single PR.
      rails-gems:
        update-types:
          - "patch"
        patterns:
          - "actionmailer"
          - "actionpack"
          - "actiontext"
          - "activejob"
          - "activemodel"
          - "activerecord"
          - "activestorage"
          - "activesupport"
          - "rails"
          - "railties"
      # GOV.UK gems minor & patch updates are grouped together into a single PR.
      govuk-gems:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "govuk-components"
          - "govuk_design_system_formbuilder"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
    - devops
    - dependencies
    - github-actions

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "govuk*"
