name: Reconcile review apps

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only display stale review apps; do not delete"
        required: true
        default: true
        type: boolean

  schedule:
    - cron: "0 08 * * 0"

  push:
    branches:
      - 2855-test

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  TERRAFORM_STATE_BUCKET: 530003481352-terraform-state

jobs:
  find-stale-review-apps:
    name: Find stale review apps
    runs-on: ubuntu-latest

    outputs:
      stale_prs: ${{ steps.find-stale.outputs.stale_prs }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
          role-to-assume: Deployments
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Find stale review apps
        id: find-stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Finding review app state files"
          echo "========================================="

          stale_prs=()

          prs=$(
            aws s3api list-object-versions \
              --bucket "${TERRAFORM_STATE_BUCKET}" \
              --query 'Versions[].Key' \
              --output text |
            tr '\t' '\n' |
            grep '^review/review-pr-[0-9]\+\.tfstate$' |
            sed -E 's|review/review-pr-([0-9]+)\.tfstate|\1|' |
            sort -u -n
          )

          if [[ -z "$prs" ]]; then
            echo "No review app state files found."

            echo "stale_prs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "Review app PR numbers discovered:"
          echo "$prs"
          echo ""

          for pr in $prs; do

            echo "Checking PR #$pr"

            pr_json=$(
              gh pr view "$pr" \
                --repo "${{ github.repository }}" \
                --json number,state,title,url \
                2>/dev/null || true
            )

            if [[ -z "$pr_json" ]]; then
              echo "PR #$pr | NOT_FOUND | stale"
              stale_prs+=("$pr")
              continue
            fi

            state=$(echo "$pr_json" | jq -r '.state')
            title=$(echo "$pr_json" | jq -r '.title')
            url=$(echo "$pr_json" | jq -r '.url')

            if [[ "$state" != "OPEN" ]]; then
              echo "PR #$pr | $state | stale"
              echo "$url"
              stale_prs+=("$pr")
            else
              echo "PR #$pr | OPEN | active"
            fi

            echo ""

          done

          if (( ${#stale_prs[@]} == 0 )); then
            stale_json="[]"
          else
            stale_json=$(printf '%s\n' "${stale_prs[@]}" | jq -R . | jq -s -c .)
          fi

          stale_count=$(jq 'length' <<< "$stale_json")

          echo ""
          echo "========================================="
          echo "Stale review apps found: $stale_count"
          echo "========================================="
          echo "$stale_json"

          echo "stale_prs=$stale_json" >> "$GITHUB_OUTPUT"

  delete-review-apps:
    name: Delete stale review apps
    needs: find-stale-review-apps

    if: >
      (
        github.event_name == 'schedule' ||
        github.event.inputs.dry_run == 'false'
      ) &&
      needs.find-stale-review-apps.outputs.stale_prs != '[]'

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.find-stale-review-apps.outputs.stale_prs) }}

    uses: ./.github/workflows/delete_review_app.yml

    with:
      pr_number: ${{ matrix.pr_number }}

    secrets: inherit
